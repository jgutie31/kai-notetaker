[package]
name = "kai-notetaker"
version = "0.1.0"
description = "KCG internal AI meeting notetaker — local-first, on-device"
authors = ["Kairos Compliance Group"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "kai_notetaker_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "1.8.5"
rusqlite = { version = "0.32", features = ["bundled-sqlcipher-vendored-openssl"] }
tokio = { version = "1", features = ["time", "rt", "macros"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
cpal = "0.18.1"
whisper-rs = { version = "0.16.0", features = ["metal"] }
hound = "3"
sherpa-onnx = "1.13.4"
llama-cpp-2 = { version = "0.1.154", features = ["metal"] }
encoding_rs = "0.8"
reqwest = { version = "0.12", features = ["blocking", "json"] }
rubato = "4.0"
getrandom = "0.4.3"
# `v1` (default) covers macOS Keychain, Windows Credential Manager, and
# Linux Secret Service behind one API — real cross-platform secret
# storage, not macOS-only. Named explicitly even though it's the crate's
# default feature set, so this stays self-documenting.
keyring = { version = "4.1.6", features = ["v1"] }
# For PKCE (RFC 7636) code_challenge generation — already resolved
# transitively by other dependencies, added directly since oauth.rs needs
# the API, not just the binary.
sha2 = "0.10"
base64 = "0.22"
# Already resolved transitively via tauri-plugin-opener; added directly
# since oauth connect flows need to open the provider's sign-in page in
# the user's default browser without going through a Tauri command/AppHandle.
open = "5.4.0"
tauri-plugin-dialog = "2"
# Already resolved transitively; added directly for calendar.rs's
# fallback join-link extraction (a Google Meet/Zoom link sitting as
# plain text in an Outlook event's body/location, since Graph's own
# onlineMeeting.joinUrl is only populated for native Teams meetings).
regex = "1"

# MicMuteToggle (ISC-274). Declared under the desktop-only target rather
# than plain `[dependencies]` because the crate itself is
# `#![cfg(not(any(target_os = "android", target_os = "ios")))]` — on mobile
# it compiles to an empty crate and any reference to its types would be a
# hard compile error. This is Tauri's own documented pattern for the
# plugin, and it keeps the deliberately-deferred Windows build (which IS
# desktop) inheriting it for free.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-global-shortcut = "2"

# TeamsCallMuteSync (ISC-280). Already resolved transitively via Tauri's
# macOS backend — added directly because `call_mute.rs` needs the CGEvent
# API, not just the linked binary. Scoped to the same desktop-only target
# block as the global-shortcut plugin above, which it pairs with: the
# hotkey that plugin registers is the sole trigger for the keystroke this
# crate synthesizes.
#
# The `elcapitan` feature is REQUIRED, not optional polish: `CGEvent::
# post_to_pid` — the entire mechanism that targets Teams' process instead
# of whatever window has focus — is `#[cfg(feature = "elcapitan")]` in
# core-graphics 0.25.0 and does not exist without it. Confirmed by a
# compile failure, not assumed. The gate names macOS 10.11 (2015); this
# app already requires far newer, so it costs nothing.
core-graphics = { version = "0.25", features = ["elcapitan"] }

[dev-dependencies]
tempfile = "3"

