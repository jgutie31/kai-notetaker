# This project loads multiple GPU-accelerated ML models (Whisper, pyannote
# diarization, an 8B LLM, a BGE embedding model) in its test suite. On a
# 16GB machine, cargo test's default parallel test execution can cause
# real Metal/memory contention — confirmed 2026-08-05: the same test suite
# passed 42/42 single-threaded and showed one transient failure in the
# heaviest test (full summarization pipeline) under default parallelism.
# Forcing single-threaded test execution trades test wall-clock time for
# reliability, which is the right tradeoff for a resource-constrained dev
# machine running real models rather than mocks.
[env]
RUST_TEST_THREADS = "1"
# llama-cpp-sys-2 and whisper-rs-sys vendor ggml's own CMake build, which
# leaves CMAKE_OSX_DEPLOYMENT_TARGET unset. Both build.rs scripts forward
# any CMAKE_-prefixed env var straight to CMake (grep "CMAKE_" in either
# build.rs) — MACOSX_DEPLOYMENT_TARGET alone does NOT reach them, since it
# doesn't match that prefix. Unset, the Command Line Tools SDK's libc++
# marks std::filesystem::path (used by ggml-backend-reg.cpp's fs::u8path
# call) unavailable below macOS 10.15, breaking `cargo build --release`
# (confirmed 2026-08-07: `tauri build` failed on this in both crates).
CMAKE_OSX_DEPLOYMENT_TARGET = "13.0"
